openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: API được phát sinh từ FR/AC trong tài liệu phân tích thiết kế CAB System.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Customer
    description: FR02, FR03, FR04, FR12, FR18

paths:
  /customers/{customerId}:
    put:
      tags: [Customer]
      summary: Cập nhật hồ sơ khách hàng
      description: FR02, AC01
      security: [{bearerAuth: []}]
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Cập nhật thành công}
        '401': {description: Chưa xác thực}
  /customers/{customerId}/trips:
    get:
      tags: [Customer]
      summary: Xem lịch sử chuyến
      description: FR18
      security: [{bearerAuth: []}]
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Trip'}


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code: {type: string, example: INVALID_REQUEST}
        message: {type: string, example: Dữ liệu không hợp lệ}
    RegisterRequest:
      type: object
      required: [fullName, phone, password, role]
      properties:
        fullName: {type: string}
        phone: {type: string}
        password: {type: string, format: password}
        role: {type: string, enum: [CUSTOMER, DRIVER]}
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: {type: string}
        password: {type: string, format: password}
    TripRequest:
      type: object
      required: [pickupLocation, destination, vehicleType]
      properties:
        pickupLocation: {type: string}
        destination: {type: string}
        vehicleType: {type: string}
    Trip:
      type: object
      properties:
        tripId: {type: string, example: CD001}
        customerId: {type: string, example: KH001}
        driverId: {type: string, nullable: true, example: TX001}
        pickupLocation: {type: string}
        destination: {type: string}
        vehicleType: {type: string}
        status:
          type: string
          enum: [SEARCHING_DRIVER, DRIVER_ACCEPTED, DRIVER_ARRIVED, PASSENGER_PICKED_UP, IN_PROGRESS, COMPLETED]
        fare: {type: number, format: double, nullable: true}
        estimatedArrival: {type: integer, nullable: true, description: Phút}
    Driver:
      type: object
      properties:
        driverId: {type: string}
        fullName: {type: string}
        phone: {type: string}
        status: {type: string, enum: [AVAILABLE, BUSY]}
        latitude: {type: number, format: double, nullable: true}
        longitude: {type: number, format: double, nullable: true}
    Vehicle:
      type: object
      properties:
        vehicleId: {type: string}
        licensePlate: {type: string}
        vehicleType: {type: string}
    Payment:
      type: object
      properties:
        paymentId: {type: string}
        tripId: {type: string}
        amount: {type: number, format: double}
        paymentMethod: {type: string, enum: [CASH, ELECTRONIC]}
        status: {type: string, enum: [PENDING, SUCCESS, FAILED]}
    RatingRequest:
      type: object
      required: [score]
      properties:
        score: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string}
